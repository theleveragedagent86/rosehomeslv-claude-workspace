<!doctype html>

<title>Before You Walk Into the Model Home | Las Vegas New Construction Buyer Guide</title>
<meta name="description" content="A plain guide to buying a newly built home in Las Vegas, Henderson, and Clark County. Every number sourced and dated. Ryan Rose, Real Broker, LLC.">

<style>
/* ---------- BASE, lifted verbatim from the winning preview ---------- */
/* ==========================================================================
   DIRECTION 3, SUNSET GEOMETRIC.
   Round three, directed. Direction 5's sunset palette, direction 1's page
   architecture, direction 5's dissolving photo header.
   The differentiator is type: no serif anywhere. Syne carries every display
   line, Karla carries every reading line.
   Warmth comes from color volume, round geometry, and big photography.
   Zero em-dashes in this file, including comments.
   ========================================================================== */

:root{
  /* paper */
  --paper:  #F7F5F0;
  --cream:  #FBF8F2;
  --white:  #FFFFFF;

  /* ink */
  --ink:    #1C2436;
  --muted:  #5F5A52;

  /* the sunset family, carried over from direction 5 */
  --sunset: #D24018;
  --clay:   #B8360F;
  --coral:  #E9714A;
  --ochre:  #EFA00B;

  /* the two cool notes */
  --agave:   #2C3F6B;
  --agave-d: #242F4A;
  --dusk:    #28375A;

  /* tints */
  --tint-clay:  #FBE5DA;
  --tint-coral: #FBE2D6;
  --tint-agave: #E4E9F2;

  /* warm rules, never a neutral gray */
  --rule:        #847B6D;
  --rule-strong: #5F5A52;

  --display: "Syne", "Trebuchet MS", "Helvetica Neue", sans-serif;
  --text:    "Karla", "Helvetica Neue", Arial, sans-serif;

  --r-xs: 3pt;
  --r-sm: 6pt;
  --r-md: 10pt;
  --r-lg: 16pt;
  --r-xl: 26pt;

  --pad: .55in;
}

*{ box-sizing:border-box; }
html{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
body{
  margin:0;
  background:var(--paper);
  font-family:var(--text);
  color:var(--ink);
}
img{ max-width:100%; display:block; }

/* ---------- the paper ---------- */
.page{
  width:8.5in; height:11in;
  margin:0 auto;
  position:relative; overflow:hidden;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--text);
}

/* ==========================================================================
   SHARED GUIDE COMPONENTS
   ========================================================================== */

/* SPECIFICITY NOTE, read before adding any component here.
   The base prose rule below is .gp p, which is (0,1,1). A component selected by a
   single class is (0,1,0) and LOSES to it, and because the base rule uses the font
   shorthand it silently resets size, weight and family. Every paragraph component
   in this guide is therefore scoped .gp .name, which is (0,2,0) and wins.
   This was caught by probing computed styles, not by looking at the page. */

/* question subhead in colored small caps, with a square glyph */
.gp .q{
  font:800 8.6pt/1.2 var(--text); letter-spacing:.15em; text-transform:uppercase;
  margin:0 0 3pt; display:flex; align-items:center; gap:6pt;
}
.gp .q::before{ content:""; width:8.5pt; height:8.5pt; border-radius:2pt; flex:0 0 auto; }
.gp .q-clay{  color:var(--clay); }    .gp .q-clay::before{  background:var(--sunset); }
.gp .q-agave{ color:var(--agave-d); } .gp .q-agave::before{ background:var(--agave); }
.gp .q-ink{   color:var(--ink); }     .gp .q-ink::before{   background:var(--ochre); }
.gp .q-white{ color:var(--cream); }   .gp .q-white::before{ background:var(--ochre); }

/* the declarative answer set larger underneath */
.a{
  font-family:var(--display); font-weight:700;
  font-size:15pt; line-height:1.14; letter-spacing:-.02em;
  margin:0 0 7pt; color:var(--ink);
}
.a.sm{ font-size:12.6pt; }

/* prose */
.gp p{ margin:0 0 7pt; font:400 9.5pt/1.5 var(--text); }
.gp .hit{
  font-family:var(--display); font-weight:700;
  font-size:14.5pt; line-height:1.16; letter-spacing:-.022em;
  color:var(--clay); margin:3pt 0 9pt;
}
sup.src{ font:800 6.2pt/1 var(--text); color:var(--agave-d); vertical-align:super; letter-spacing:.02em; }
.gp .attr, .attr{ font:600 7.4pt/1.42 var(--text); color:var(--muted); letter-spacing:.015em; margin:0; }

/* tinted rounded callout cards */
.card{
  border-radius:var(--r-md); padding:10pt 11pt;
  break-inside:avoid; page-break-inside:avoid;
}
.card p{ font-size:9.4pt; line-height:1.44; }
.card p:last-child{ margin-bottom:0; }
.card-clay{  background:var(--tint-clay); }
.card-coral{ background:var(--tint-coral); }
.card-agave{ background:var(--tint-agave); }
.card-dusk{  background:var(--dusk); color:var(--cream); }
.card-dusk p{ color:var(--cream); }
.card-dusk sup.src{ color:var(--ochre); }

/* numbered list, numerals in filled circles, flexbox bullets only */
.nlist{ list-style:none; margin:0; padding:0; }
.nlist li{ display:flex; gap:7pt; margin-bottom:7pt; break-inside:avoid; page-break-inside:avoid; }
.nlist li:last-child{ margin-bottom:0; }
.nlist .n{
  flex:0 0 16pt; height:16pt; border-radius:999px;
  background:var(--sunset); color:var(--white);
  font:800 9.4pt/16pt var(--text); text-align:center; letter-spacing:0;
}
.nlist .t{ flex:1 1 auto; font:400 9.5pt/1.45 var(--text); }
.nlist .t b{ font-weight:800; }

/* checklist, flexbox bullets only */
.chk{ list-style:none; margin:0; padding:0; }
.chk.two{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:5pt 16pt; }
.chk.two li{ margin-bottom:0; }
.chk li{ display:flex; gap:7pt; margin-bottom:6pt; break-inside:avoid; page-break-inside:avoid; }
.chk li:last-child{ margin-bottom:0; }
.chk .box{
  flex:0 0 11pt; height:11pt; margin-top:1.6pt;
  border:1.6pt solid var(--rule-strong); border-radius:2.5pt; background:var(--white);
}
.chk .t{ flex:1 1 auto; font:400 8.2pt/1.36 var(--text); }
.chk .t b{ font-weight:800; }

/* the refusal callout, the loudest object on the spread */
.refuse{
  background:var(--sunset); color:var(--white);
  border-radius:var(--r-lg); padding:12pt 14pt;
  break-inside:avoid; page-break-inside:avoid;
}
.ribbon{
  display:inline-block; background:var(--cream); color:var(--clay);
  font:800 7.4pt/1 var(--text); letter-spacing:.18em; text-transform:uppercase;
  padding:5pt 10pt 4.5pt; border-radius:999px; margin-bottom:10pt;
}
.refuse h3{
  font-family:var(--display); font-weight:800;
  font-size:21pt; line-height:1.04; letter-spacing:-.028em;
  margin:0 0 8pt; color:var(--white); max-width:5.4in;
}
.refuse p{ color:var(--white); font:400 9.2pt/1.48 var(--text); margin:0 0 6pt; }
.refuse p:last-child{ margin-bottom:0; }
.refuse .beat{ font-weight:800; }
.refuse .split{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:14pt; }

/* figures */
.fig{ break-inside:avoid; page-break-inside:avoid; margin:0; }
.fig svg{ width:100%; max-width:236px; height:auto; display:block; margin:0 auto; }
.figcap{ font:600 7.2pt/1.38 var(--text); color:var(--muted); margin:6pt 0 0; }

/* table */
.tbl-wrap{ break-inside:avoid; page-break-inside:avoid; }
table.sid{ width:100%; border-collapse:collapse; table-layout:fixed; font-family:var(--text); }
table.sid caption{
  caption-side:top; text-align:left;
  font:700 6.6pt/1.28 var(--text); color:var(--muted);
  padding:0 0 3.4pt;
}
table.sid thead{ display:table-header-group; }
table.sid th[scope="col"]{
  background:var(--dusk); color:var(--cream);
  font:800 6.2pt/1 var(--text); letter-spacing:.05em; text-transform:uppercase;
  text-align:left; padding:6pt 5pt 5.4pt;
}
table.sid th[scope="col"]:first-child{ border-radius:var(--r-xs) 0 0 0; }
table.sid th[scope="col"]:last-child{ border-radius:0 var(--r-xs) 0 0; }
table.sid tbody th{
  text-align:left; font:800 8pt/1.2 var(--text); color:var(--clay);
  padding:2.4pt 4pt; white-space:nowrap;
}
table.sid td{ font:400 8pt/1.2 var(--text); color:var(--ink); padding:2.4pt 4pt; font-variant-numeric:tabular-nums; }
table.sid tbody tr:nth-child(odd){ background:var(--paper); }
table.sid tbody tr:nth-child(even){ background:var(--tint-clay); }

/* status tokens. Never color alone: literal words plus a glyph plus a rule. */
.tok{
  display:inline-flex; align-items:center; gap:4pt;
  font:800 5.9pt/1 var(--text); letter-spacing:.04em; text-transform:uppercase;
  padding:2pt 4pt 1.8pt 3pt; border-radius:2pt 4pt 4pt 2pt; white-space:nowrap;
}
.tok i{ flex:0 0 auto; width:5pt; height:5pt; border-radius:1.2pt; display:block; }
.tok-nf{ color:var(--clay); border-left:2.6pt solid var(--clay); }
.tok-nf i{ border:1.4pt solid var(--clay); background:transparent; }   /* hollow square */
.tok-done{ color:var(--agave-d); border-left:2.6pt solid var(--agave-d); text-transform:none; letter-spacing:.02em; }
.tok-done i{ background:var(--agave-d); }                                /* filled square */

/* phone block */
.phone-row{ display:flex; align-items:center; gap:9pt; margin-bottom:6pt; }
.phone-row:last-child{ margin-bottom:0; }
.phone-row .who{ flex:1 1 auto; font:400 8.2pt/1.38 var(--text); }
.phone-row .who b{ font-weight:800; }
.phone-num{
  flex:0 0 auto; background:var(--white); color:var(--clay);
  border:1.4pt solid var(--rule); border-radius:var(--r-sm);
  padding:5pt 8pt 4pt;
  font-family:var(--display); font-weight:700; font-size:11.6pt; line-height:1.16;
  letter-spacing:-.02em; white-space:nowrap; text-align:center; font-variant-numeric:tabular-nums;
}

/* pull line */
.gp .pull{
  font-family:var(--display); font-weight:800;
  font-size:23pt; line-height:1.02; letter-spacing:-.034em;
  color:var(--ink); margin:0;
}
.gp .pull span{ color:var(--sunset); }

/* soft close */
.close{
  display:flex; gap:11pt; align-items:center;
  background:var(--ink); color:var(--cream);
  border-radius:var(--r-md); padding:8pt 12pt;
  break-inside:avoid; page-break-inside:avoid;
}
.close p{ margin:0; font:400 9.2pt/1.45 var(--text); color:var(--cream); }
.close p b{ color:var(--ochre); font-weight:800; }
.close .mk{ flex:0 0 auto; }

/* running head band and folios */
.band{ position:relative; height:52px; overflow:hidden; }
.band img{ width:100%; height:100%; object-fit:cover; object-position:50% 46%; }
.band .tone{
  position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(40,55,90,.62) 0%, rgba(210,64,24,.42) 100%);
  mix-blend-mode:multiply;
}
.band .head{
  position:absolute; inset:0; padding:0 var(--pad);
  display:flex; align-items:center; justify-content:space-between; gap:12pt;
}
.rh-a, .rh-b{
  font:800 7.4pt/1 var(--text); letter-spacing:.18em; text-transform:uppercase;
  padding:5pt 10pt 4.4pt; border-radius:999px;
}
.rh-a{ background:var(--sunset); color:var(--white); }
.rh-b{ background:var(--dusk); color:var(--cream); }

.foot{
  position:absolute; left:0; right:0; bottom:0; height:48px;
  display:flex; align-items:center; padding:0 var(--pad);
  border-top:.75pt solid var(--rule);
}
.foot .srcnote{ font:600 6.9pt/1.35 var(--text); color:var(--muted); letter-spacing:.015em; }
.folio{
  font-family:var(--display); font-weight:800; font-size:15pt; line-height:1;
  letter-spacing:-.02em;
  color:var(--white); background:var(--sunset);
  width:.48in; height:.40in;
  display:flex; align-items:center; justify-content:center;
}
.foot-l{ justify-content:space-between; }
.foot-l .folio{ border-radius:11pt 3pt 3pt 11pt; margin-left:11pt; }
.foot-r{ justify-content:flex-start; gap:11pt; }
.foot-r .folio{ border-radius:3pt 11pt 11pt 3pt; background:var(--dusk); }

.gp .body{ position:absolute; left:0; right:0; top:0; bottom:48px; }
.pad{ padding:0 var(--pad); }
.cols{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:18pt; }

/* ==========================================================================
   PANEL A. COVER
   ========================================================================== */
.cover-photo{ position:absolute; inset:0 0 auto 0; height:536px; overflow:hidden; }
.cover-photo img{ width:100%; height:100%; object-fit:cover; object-position:50% 56%; }
.cover-photo .tone{
  position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(40,55,90,.50) 0%, rgba(210,64,24,.30) 52%, rgba(210,64,24,.14) 100%);
  mix-blend-mode:multiply;
}
.cover-photo .lift{
  position:absolute; inset:0;
  background:radial-gradient(110% 68% at 78% 20%, rgba(239,160,11,.26) 0%, rgba(239,160,11,0) 62%);
}
.cover-top{
  position:absolute; top:48px; left:var(--pad); right:var(--pad);
  display:flex; align-items:flex-start; justify-content:space-between; gap:12pt;
}
.chip{
  display:inline-block; padding:6pt 12pt 5.4pt; border-radius:999px;
  font:800 8.4pt/1 var(--text); letter-spacing:.16em; text-transform:uppercase;
}
.chip-sunset{ background:var(--sunset); color:var(--white); }
.chip-coral{  background:var(--coral);  color:var(--ink); box-shadow:inset 0 0 0 1pt var(--rule-strong); }
.chip-agave{  background:var(--agave);  color:var(--white); }
.mark{
  display:inline-flex; align-items:center; gap:7pt;
  background:var(--ink); border-radius:999px; padding:6pt 13pt 5.4pt 7pt;
}
.mark b{ font:800 8.4pt/1 var(--text); letter-spacing:.16em; text-transform:uppercase; color:var(--cream); }
.mark .sq{ width:12pt; height:12pt; border-radius:3pt; background:var(--ochre); display:block; }

.seam{ position:absolute; left:0; right:0; bottom:557px; height:16px; display:flex; }
.seam i{ flex:1; display:block; }

.cover-panel{
  position:absolute; left:0; right:0; bottom:0; height:557px;
  background:var(--paper);
  border-radius:var(--r-xl) var(--r-xl) 0 0;
  padding:.36in var(--pad) .34in;
  display:flex; flex-direction:column;
}
.cover-eyebrow{
  font:800 8.6pt/1 var(--text); letter-spacing:.22em; text-transform:uppercase;
  color:var(--clay); margin:0 0 13pt;
}
.cover-title{
  font-family:var(--display); font-weight:800;
  font-size:36pt; line-height:1.0; letter-spacing:-.032em; text-transform:uppercase;
  color:var(--ink); margin:0 0 14pt; max-width:7.1in;
}
.cover-title em{ font-style:normal; color:var(--sunset); }
.cover-sub{ font:400 12.4pt/1.45 var(--text); color:var(--ink); max-width:4.7in; margin:0 0 12pt; }
.geo{ display:flex; gap:6pt; flex-wrap:wrap; margin:0 0 13pt; }
.cred{
  align-self:flex-start; margin-left:calc(var(--pad) * -1);
  background:var(--ochre); color:var(--ink);
  box-shadow:inset 0 -1pt 0 var(--rule-strong), inset 0 1pt 0 var(--rule-strong);
  border-radius:0 999px 999px 0;
  padding:7pt var(--pad) 6pt;
  font:800 9.6pt/1.3 var(--text); letter-spacing:.005em;
}
.byline{
  display:flex; align-items:flex-end; justify-content:space-between; gap:16pt;
  border-top:2.6pt solid var(--ink); padding-top:12pt; margin-top:auto;
}
.byname{
  font-family:var(--display); font-weight:700; font-size:21pt; line-height:1;
  letter-spacing:-.02em; margin:0 0 6pt;
}
.brokerage{
  display:inline-flex; align-items:center; gap:6pt;
  background:var(--ink); color:var(--cream);
  border-radius:999px; padding:5.4pt 12pt 4.8pt 6pt;
}
.brokerage b{ font:800 8.6pt/1 var(--text); letter-spacing:.14em; text-transform:uppercase; }
.brokerage .sq{ width:11pt; height:11pt; border-radius:3pt; background:var(--ochre); display:block; }
.edition{ text-align:right; font:600 7.8pt/1.55 var(--text); color:var(--muted); }
.edition b{ display:block; font-weight:800; color:var(--clay); letter-spacing:.12em; text-transform:uppercase; font-size:8pt; }
.compliance{
  margin-top:11pt; padding-top:8pt; border-top:.75pt solid var(--rule);
  font:500 7.4pt/1.5 var(--text); color:var(--muted);
  display:flex; justify-content:space-between; gap:14pt; flex-wrap:wrap;
}
.compliance .lic{ white-space:nowrap; }
.compliance .lic b{ color:var(--ink); font-weight:800; }

/* ==========================================================================
   PANEL B. THE SECTION OPENER, the direction 5 photo header device
   ========================================================================== */
.opener{ position:absolute; inset:0 0 auto 0; height:320px; overflow:hidden; background:var(--paper); }
.opener img{ width:100%; height:100%; object-fit:cover; object-position:50% 52%; }
/* ONE alpha layer, tone and dissolve in the same ramp. No mix-blend-mode, so the
   bottom edge of the photograph cannot leave a seam against the page paper.
   Type begins at 85 percent, where the paper stop resolves to 0.929 opacity. */
.opener .dissolve{
  position:absolute; inset:0;
  background:linear-gradient(180deg,
    rgba(40,55,90,.42) 0%,
    rgba(40,55,90,.20) 28%,
    rgba(184,54,15,.16) 50%,
    rgba(247,245,240,.30) 64%,
    rgba(247,245,240,.80) 76%,
    rgba(247,245,240,1) 90%);
}
.opener-chip{
  position:absolute; top:40px; left:var(--pad);
}
.op-body{
  position:absolute; top:272px; left:var(--pad); right:var(--pad); bottom:0;
  display:flex; flex-direction:column;
}
.gp .op-eyebrow{
  font:800 8.6pt/1 var(--text); letter-spacing:.2em; text-transform:uppercase;
  color:var(--clay); margin:0 0 10pt;
}
.op-h{
  font-family:var(--display); font-weight:800;
  font-size:31pt; line-height:1.02; letter-spacing:-.03em;
  color:var(--ink); margin:0 0 6pt; max-width:6.9in;
}
.gp .op-line{
  font-family:var(--display); font-weight:700;
  font-size:19pt; line-height:1.14; letter-spacing:-.024em;
  color:var(--sunset); margin:0 0 12pt; max-width:6.2in;
}
.gp .op-deck{
  font:500 12pt/1.45 var(--text); color:var(--ink);
  max-width:5.6in; margin:0 0 13pt;
}
.gp .op-deck b{ font-weight:800; color:var(--clay); }

/* ==========================================================================
   PANEL C. LANDING HERO
   ========================================================================== */
.hero-frame{
  container-type:inline-size;
  background:var(--cream);
  border-radius:14px; overflow:hidden;
}
.frame-1280{ width:1280px; max-width:100%; }
.frame-375{ width:375px; flex:0 0 375px; }
.hero{
  font-family:var(--text); color:var(--ink);
  background:
    radial-gradient(110% 74% at 100% 0%, rgba(239,160,11,.26) 0%, rgba(239,160,11,0) 58%),
    radial-gradient(88% 66% at 0% 100%, rgba(210,64,24,.11) 0%, rgba(210,64,24,0) 62%),
    var(--cream);
}
.hero-nav{
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  padding:18px clamp(18px,3.2cqw,42px);
  border-bottom:1px solid var(--rule);
}
.hero-nav .brand{ display:flex; align-items:center; gap:10px; }
.hero-nav .brand b{ font:800 13px/1 var(--text); letter-spacing:.17em; text-transform:uppercase; }
.hero-nav .broker{
  font:800 10px/1 var(--text); letter-spacing:.15em; text-transform:uppercase;
  color:var(--cream); background:var(--ink); padding:7px 12px; border-radius:999px;
}
.hero-grid{
  display:grid; grid-template-columns:minmax(0,1.06fr) minmax(0,.94fr); gap:clamp(20px,3cqw,44px);
  padding:clamp(24px,3.4cqw,46px) clamp(18px,3.2cqw,42px) clamp(28px,3.4cqw,48px);
  align-items:start;
}
.hero-eyebrow{
  display:inline-block; background:var(--sunset); color:var(--white);
  font:800 11px/1 var(--text); letter-spacing:.16em; text-transform:uppercase;
  padding:9px 15px 8px; border-radius:999px; margin-bottom:18px;
}
.hero h1{
  font-family:var(--display); font-weight:800;
  font-size:clamp(34px,4.4cqw,56px); line-height:1.02; letter-spacing:-.032em;
  margin:0 0 16px;
}
.hero h1 em{ font-style:normal; color:var(--sunset); }
.hero .sub{
  font:400 clamp(15px,1.35cqw,18px)/1.58 var(--text); color:var(--ink);
  margin:0 0 24px; max-width:36em;
}
.props{ display:grid; gap:12px; margin:0 0 26px; padding:0; list-style:none; }
.prop{ display:flex; gap:13px; border-radius:14px; padding:15px 17px; break-inside:avoid; }
.prop .ic{ flex:0 0 36px; height:36px; border-radius:11px; display:flex; align-items:center; justify-content:center; }
.prop h3{ font-family:var(--display); font-weight:700; font-size:15px; line-height:1.25; letter-spacing:-.015em; margin:0 0 5px; }
.prop p{ font:400 13px/1.55 var(--text); margin:0; }
.prop-1{ background:var(--tint-coral); }  .prop-1 .ic{ background:var(--sunset); }

<style>
/* ==========================================================================
   ADDED FOR THE SHIPPING GUIDE. Not in the preview, because the preview only
   had to show three pages and a hero. Nothing here restyles a preview
   component; these are the pieces a 39 page document needs and a 3 page
   sample did not.
   ========================================================================== */

/* Screen-only page separation. The preview got this from its grey rail, which
   is gone. Print overrides it back to nothing. */
.page{ box-shadow:0 2px 14px rgba(28,36,54,.13); margin-bottom:18px; }
@media print{ .page{ box-shadow:none; margin-bottom:0; } }

/* The source strip runs to two lines on the dense pages. The preview only ever
   showed a one line example, and a 48px foot holds two lines of 6.9pt/1.35
   with room left over. Measured, not assumed. */
.foot .srcnote{ max-width:6.6in; }
.foot-l .srcnote{ padding-right:8pt; }

/* Skip link, screen only. A 39 page print document still gets keyboard users. */
.skip{
  position:absolute; left:-9999px; top:0;
  background:var(--ink); color:var(--paper);
  font:800 12px/1 var(--text); padding:12px 16px; border-radius:0 0 var(--r-sm) 0;
  z-index:10; text-decoration:none;
}
.skip:focus{ left:0; }
@media print{ .skip{ display:none; } }

/* Links. The preview never had one, so nothing styled them and all 21 anchors in
   the guide rendered default browser blue, which is outside the palette and
   prints as grey mud. Clay rather than navy so a link does not read as a heading,
   and the underline is offset so it does not collide with descenders. */
.gp a, .close a, .card a{
  color:var(--clay); text-decoration:underline;
  text-decoration-thickness:.6pt; text-underline-offset:2px;
}
.gp a:hover{ text-decoration-thickness:1.2pt; }
.gp a:focus-visible{ outline:2.5px solid var(--navy-800); outline-offset:2px; }
.card-dusk a, .close a{ color:var(--gold); }
@media print{
  /* In print a link cannot be clicked, so it has to carry its own address.
     Only for external links, and only where the href is a real URL. */
  .gp a[href^="http"]::after{
    content:" (" attr(data-print) ")";
    font-weight:600; color:var(--muted); text-decoration:none;
  }
  .gp a[href^="http"]:not([data-print])::after{ content:""; }
}

/* Inline diagram sizing. build/svg/index.md requires the SVGs to be inlined
   rather than referenced as an image file, so role="img", title and desc
   reach a screen reader and print-color-adjust reaches the fills. An inlined
   svg has no intrinsic box, so it needs one here.

   SIZING RULE, measured not guessed. Every diagram is authored at viewBox width
   700 and its smallest label is 8 design units. Rendered at width W the label
   prints at 6 * (W/710) points. So:
        full measure, 710px  ->  6.0pt   legible
        85 percent,   604px  ->  5.1pt   floor
        half column,  343px  ->  2.9pt   illegible

   A 700 wide diagram therefore CANNOT sit in a .cols column. Four of them did,
   and printed labels at 2.9 to 3.2pt. `.fig` spans the full measure by default
   and `.fig.col` is the opt in for the two diagrams authored narrow. */
.fig svg{ width:100%; max-width:100%; height:auto; }
.fig.wide{ grid-column:1 / -1; }
.fig.narrow svg{ max-width:236px; }

/* Contents block on p2. Typography, per the outline, not a component. */
.toc{ list-style:none; margin:0; padding:0; }
.toc li{
  display:flex; align-items:baseline; gap:6pt;
  font:400 9pt/1.5 var(--text); margin-bottom:3.4pt;
  break-inside:avoid; page-break-inside:avoid;
}
.toc .lbl{ flex:0 0 auto; font-weight:700; }
.toc .dots{ flex:1 1 auto; border-bottom:.75pt dotted var(--rule); transform:translateY(-2px); }
.toc .pg{ flex:0 0 auto; font-weight:800; font-variant-numeric:tabular-nums; }
.toc .grp{
  font:800 7.2pt/1 var(--text); letter-spacing:.16em; text-transform:uppercase;
  color:var(--navy-700); margin:9pt 0 5pt;
}
.toc li:first-child .grp{ margin-top:0; }

/* Path edge tab. audience-path-map.md requires a reader to find their path by
   the edge of the closed stack, and requires it to survive a black and white
   printer, so the three tabs are separated by value and the pale one inverts.
   Hexes are written out because a :root custom property does not reach here
   any more reliably than it reached inside the inline SVGs. */
.tab{
  position:absolute; right:0; width:.30in;
  display:flex; align-items:center; justify-content:center;
  writing-mode:vertical-rl;
  font:800 7pt/1 var(--text); letter-spacing:.19em; text-transform:uppercase;
}
.tab-a{ background:#304880; color:#F7F5F0; top:1.30in; height:2.15in; }
.tab-b{ background:#141A27; color:#F7F5F0; top:3.55in; height:2.15in; }
.tab-c{
  background:#EDE9E0; color:#1C2436; top:5.80in; height:2.15in;
  box-shadow:inset 0 0 0 2pt #141A27;
}

/* `.tok` is an inline-flex chip with 4pt of right padding, so a sentence that
   ends right after one prints a visible gap before its period. It hit all three
   writers, who each worked around it by reordering the sentence. Fixed once here
   instead. */
.tok{ margin-right:-2.4pt; }
.tok + .tok{ margin-left:2.4pt; }

/* ==========================================================================
   SOURCE APPENDIX, pages 40 to 44.

   This is the decision recorded in this folder's CLAUDE.md: "Attribution is now
   one short inline line under the paragraph it supports, with full URLs in a
   numbered back appendix." The design sample's own running foot already pointed
   at "the source appendix, page 41", and the folder header already described a
   44 page guide. 39 content pages plus 5 appendix pages is where 44 comes from.

   Set at 7pt over 1.34 in two columns. 34 of 39 pages cite something, and a
   guide that hides its sources is a brochure.
   ========================================================================== */
.srclist{
  columns:2; column-gap:20pt; column-rule:.75pt solid var(--rule);
  list-style:none; margin:0; padding:0;
}
.srclist li{
  break-inside:avoid; page-break-inside:avoid;
  margin:0 0 5.4pt; padding-left:8pt; border-left:1.6pt solid var(--navy-tint);
  font:400 7pt/1.34 var(--text); color:var(--ink);
}
/* The marker run reads "12 to 14, 19", so it cannot be an absolutely positioned
   numeral in a fixed gutter the way a single number could. It leads the row. */
.srclist .sn{
  font-weight:800; font-variant-numeric:tabular-nums; color:var(--navy-700);
  margin-right:4pt;
}
.srclist .sv{ font-weight:700; }
.srclist .su{ color:var(--muted); word-break:break-all; }
.srclist .sd{ color:var(--muted); white-space:nowrap; }
.srclist .snf{ color:var(--clay); font-weight:800; }
.appx-lede{ font:500 8.6pt/1.45 var(--text); color:var(--ink); margin:0 0 10pt; max-width:6.4in; }
.appx-lede b{ font-weight:800; }

/* Tear-out rule on p38. page-budget.md designs that page to be physically
   removed, so it prints a cut line. */
.tearout{
  position:absolute; left:0; right:0; top:0;
  border-top:1.2pt dashed var(--rule-strong);
}
.tearout span{
  position:absolute; left:var(--pad); top:5pt;
  font:800 6.4pt/1 var(--text); letter-spacing:.16em; text-transform:uppercase;
  color:var(--muted); background:var(--paper); padding:0 5pt;
}
