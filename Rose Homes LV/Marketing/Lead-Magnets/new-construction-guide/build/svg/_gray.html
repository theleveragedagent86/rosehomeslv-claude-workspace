<section><h2>svg-02</h2><div class="fig"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 322" width="100%"

<title id="sv02t">Who works for whom at a model home</title>
<desc id="sv02d">Two columns divided by a dashed line. The builder's side holds the on-site sales representative, who is paid by and represents the builder. Your side holds an agent who represents you and owes four duties Nevada does not allow to be waived: reasonable care, confidentiality for one year after the agreement ends, presenting every offer, and disclosing known material facts. A footer notes the written buyer agreement required since August 17, 2024 and the Duties Owed form.</desc>

<text x="0" y="14" class="sv-k">Page 3</text><text x="0" y="31" class="sv-h">Who works for whom at a model home</text>
<line x1="350.0" y1="44" x2="350.0" y2="258" stroke="#847B6D" stroke-width="1" stroke-dasharray="3 4"/>
<rect x="0" y="44" width="330" height="30" rx="6" fill="#28375A"/>
<text x="14" y="64" class="sv-r" style="letter-spacing:.08em">THE BUILDER'S SIDE</text>
<rect x="0" y="84" width="330" height="52" rx="6" fill="#EDE9E0" stroke="#847B6D" stroke-width="1"/>
<text x="14" y="104" class="sv-l">The on-site sales representative</text>
<text x="14" y="120" class="sv-s"><tspan x="14" dy="0">Paid by the builder. Represents the builder. One national builder</tspan><tspan x="14" dy="11">publishes exactly that in its own buyer materials.</tspan></text>
<text x="14" y="168" class="sv-l">What that means for you</text>
<circle cx="20" cy="182.5" r="2.4" fill="#5F5A52"/>
<text x="32" y="186" class="sv-b"><tspan x="32" dy="0">They are not your agent and owe you no duty of loyalty.</tspan></text>
<circle cx="20" cy="208.5" r="2.4" fill="#5F5A52"/>
<text x="32" y="212" class="sv-b"><tspan x="32" dy="0">Anything you tell them, you have told the builder.</tspan></text>
<circle cx="20" cy="234.5" r="2.4" fill="#5F5A52"/>
<text x="32" y="238" class="sv-b"><tspan x="32" dy="0">This is a role difference, not a character judgment.</tspan></text>
<rect x="370" y="44" width="330" height="30" rx="6" fill="#304880"/>
<text x="384" y="64" class="sv-r" style="letter-spacing:.08em">YOUR SIDE</text>
<rect x="370" y="84" width="330" height="52" rx="6" fill="#FBEFD3" stroke="#847B6D" stroke-width="1"/>
<text x="384" y="104" class="sv-l">An agent who represents you</text>
<text x="384" y="120" class="sv-s"><tspan x="384" dy="0">Owes duties Nevada does not let either of you waive, even by</tspan><tspan x="384" dy="11">agreement.</tspan></text>
<text x="384" y="168" class="sv-l">Duties that cannot be waived</text>
<path d="M386.8 182.5 l2.5600000000000005 2.8800000000000003 l4.800000000000001 -6.08" fill="none" stroke="#2C3F6B" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
<text x="402" y="186" class="sv-b">Reasonable care</text>
<path d="M386.8 200.5 l2.5600000000000005 2.8800000000000003 l4.800000000000001 -6.08" fill="none" stroke="#2C3F6B" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
<text x="402" y="204" class="sv-b">Confidentiality, for one year after the agreement ends</text>
<path d="M386.8 218.5 l2.5600000000000005 2.8800000000000003 l4.800000000000001 -6.08" fill="none" stroke="#2C3F6B" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
<text x="402" y="222" class="sv-b">Presenting every offer</text>
<path d="M386.8 236.5 l2.5600000000000005 2.8800000000000003 l4.800000000000001 -6.08" fill="none" stroke="#2C3F6B" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
<text x="402" y="240" class="sv-b">Disclosing known material facts</text>
<rect x="0" y="268" width="700" height="46" rx="6" fill="#E4E9F2"/><text x="12" y="287" class="sv-b"><tspan x="12" dy="0">Since August 17, 2024 you and your agent sign a written agreement spelling out how the agent is paid, before you tour. A Nevada licensee</tspan><tspan x="12" dy="12">must also disclose every source they are paid from, and hand every party the Duties Owed form.</tspan></text>
</svg>

<section><h2>svg-03</h2><div class="fig"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="100%"

<desc id="sv03d">A horizontal timeline in five stages: before you visit anything, choosing the community and lot, the contract, the build, and closing plus your first year. Below it, three items marked as legal deadlines rather than practical steps: the five calendar day cancellation window in a common interest community, the forty-five day builder repair clock inside year one, and the July 1 assessor postcard that must be returned to keep the 3 percent tax cap.</desc>

<section><h2>svg-04</h2><div class="fig"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="100%"
     role="img" aria-labelledby="sv04t sv04d" font-family="Archivo,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">
<title id="sv04t">Where the special assessment sits next to your house payment</title>
<desc id="sv04d">A payment stack drawn inside an escrow box holding principal and interest, property tax, homeowners insurance, master HOA and sub-association HOA. The special assessment is drawn outside the box, connected by an arrow labeled not in escrow, because it arrives on its own semi-annual bill and is a lien until paid. A bar beneath shows it financing over 10 to 30 years and then ending. The dollar amount is marked NOT FOUND because no office publishes a per home figure.</desc>

<title id="sv06t">Where builder incentive money can and cannot go</title>

<section><h2>svg-07</h2><div class="fig"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 402" width="100%"
     role="img" aria-labelledby="sv07t sv07d" font-family="Archivo,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">
<title id="sv07t">Two clocks, your rate lock and the build calendar</title>
<desc id="sv07d">Two parallel horizontal timelines. The upper one is the build: a short pre-construction period, then four to five months of build published by one builder and six to twelve months by another, ending at a contractual outside date of two years from signing. The lower one is your rate lock: a short locked window followed by a long hatched unlocked stretch during which the rate moves weekly. Three marked collision points: the lock expiring before the house is finished, the builder's forward commitment rate pool running dry, and the appraisal landing months after the price was set.</desc>
<style>.sv-h{font:700 13px Archivo,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;fill:#1C2436;letter-spacing:.002em}
.sv-k{font:700 8.4px Archivo,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;fill:#5F5A52;letter-spacing:.09em;text-transform:uppercase}

<text x="0" y="172" class="sv-s"><tspan x="0" dy="0">In July 2026 the national</tspan><tspan x="0" dy="11">30 year average moved</tspan><tspan x="0" dy="11">every single week, 6.43 to</tspan><tspan x="0" dy="11">6.58 percent. That is a</tspan><tspan x="0" dy="11">survey average, not a</tspan><tspan x="0" dy="11">quote.</tspan></text>

<text x="24.0" y="278" class="sv-l"><tspan x="24.0" dy="0">Your lock expires before the house</tspan><tspan x="24.0" dy="12">is finished.</tspan></text>
<text x="0.0" y="310" class="sv-s"><tspan x="0.0" dy="0">Extending costs money, floating costs certainty,</tspan><tspan x="0.0" dy="11">and no builder publishes a fee schedule.</tspan></text>

<text x="257.33333333333337" y="278" class="sv-l"><tspan x="257.33333333333337" dy="0">The builder's rate pool runs dry.</tspan></text>
<text x="233.33333333333334" y="310" class="sv-s"><tspan x="233.33333333333334" dy="0">A builder can pay a lender in advance to lock a</tspan><tspan x="233.33333333333334" dy="11">below market rate on a pool of future loans. Two</tspan><tspan x="233.33333333333334" dy="11">publish that the rate lasts only until the pool</tspan><tspan x="233.33333333333334" dy="11">is depleted or expires.</tspan></text>

<text x="466.6666666666667" y="310" class="sv-s"><tspan x="466.6666666666667" dy="0">A price agreed today gets appraised five to</tspan><tspan x="466.6666666666667" dy="11">twelve months from now, and an appraisal that</tspan><tspan x="466.6666666666667" dy="11">moves your loan-to-value can push you across the</tspan><tspan x="466.6666666666667" dy="11">$832,750 conforming line.</tspan></text>

<title id="sv09t">The four inspection checkpoints</title>
<desc id="sv09d">Four schematic houses at four build stages. First, pre-drywall, drawn with studs visible, where framing, straps and hangers, plumbing and electrical runs, duct routing, flashing and waterproofing are visible, and after which everything behind the drywall is sealed. Second, the blue tape walkthrough, for surfaces, fit and finish and whether the options ordered are what was installed. Third, the final walkthrough and the written punch list. Fourth, the eleven month warranty walkthrough, drawn with a clock. A footer notes that Nevada measures the statutory one year warranty from completion of the written punch list, not from closing.</desc>

<section><h2>svg-11</h2><div class="fig"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 396" width="100%"
     role="img" aria-labelledby="sv11t sv11d" font-family="Archivo,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">
<title id="sv11t">The three builder business models</title>
<desc id="sv11d">A left-to-right spectrum from less choice and more certainty to more choice and more decisions. Model one is a fixed package: no design center and no upgrades, where you gain a price that does not move and give up every choice past the floor plan. Model two is included features, where you gain real equipment in the base price and give up control because features vary by community and homesite. Model three is a full design center, where you gain the house you chose and give up budget certainty and time. Two hard limits are listed, and a NOT FOUND note records that no volume builder publishes a design center spend requirement, a credit amount, or whether upgrades can be financed.</desc>
<style>.sv-h{font:700 13px Archivo,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;fill:#1C2436;letter-spacing:.002em}

<text x="0" y="14" class="sv-k">Page 14</text><text x="0" y="31" class="sv-h">"Included" means three completely different things</text>
<rect x="0" y="56" width="700" height="8" rx="4" fill="#EDE9E0"/>

<text x="0" y="82" class="sv-k">LESS CHOICE, MORE CERTAINTY</text>
<text x="700" y="82" class="sv-k sv-e">MORE CHOICE, MORE DECISIONS</text>
<rect x="0" y="96" width="226" height="28" rx="6" fill="#242F4A"/>
<text x="12" y="115" class="sv-r">Model 1 · Fixed package</text>
<text x="12" y="142" class="sv-b"><tspan x="12" dy="0">One builder has no design center and no</tspan><tspan x="12" dy="12">upgrades at all. You buy a set inclusion</tspan><tspan x="12" dy="12">package.</tspan></text>
<path d="M14.8 212.5 l2.5600000000000005 2.8800000000000003 l4.800000000000001 -6.08" fill="none" stroke="#2C3F6B" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
<text x="30" y="216" class="sv-s"><tspan x="30" dy="0">You gain: a price that does not move, and</tspan><tspan x="30" dy="11">a shorter path to the keys.</tspan></text>
<path d="M14.8 241.3 l6.4 6.4 M21.2 241.3 l-6.4 6.4" fill="none" stroke="#5F5A52" stroke-width="1.9" stroke-linecap="round"/>
<text x="30" y="248" class="sv-s"><tspan x="30" dy="0">You give up: every choice past the floor</tspan><tspan x="30" dy="11">plan.</tspan></text>
<rect x="237" y="96" width="226" height="28" rx="6" fill="#2C3F6B"/>
<text x="249" y="115" class="sv-r">Model 2 · Included features</text>
<text x="249" y="142" class="sv-b"><tspan x="249" dy="0">An included-features model instead of a</tspan><tspan x="249" dy="12">buyer-facing design center. Some compete</tspan><tspan x="249" dy="12">on standards: owned solar, an EV outlet,</tspan><tspan x="249" dy="12">a smart home package, a tankless water</tspan><tspan x="249" dy="12">heater.</tspan></text>
<path d="M251.8 212.5 l2.5600000000000005 2.8800000000000003 l4.800000000000001 -6.08" fill="none" stroke="#2C3F6B" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
<text x="267" y="216" class="sv-s"><tspan x="267" dy="0">You gain: real equipment in the base</tspan><tspan x="267" dy="11">price.</tspan></text>
<path d="M251.8 241.3 l6.4 6.4 M258.2 241.3 l-6.4 6.4" fill="none" stroke="#5F5A52" stroke-width="1.9" stroke-linecap="round"/>
<text x="267" y="248" class="sv-s"><tspan x="267" dy="0">You give up: control. Features vary by</tspan><tspan x="267" dy="11">community and by homesite.</tspan></text>
<rect x="474" y="96" width="226" height="28" rx="6" fill="#304880"/>
<text x="486" y="115" class="sv-r">Model 3 · Full design center</text>
<text x="486" y="142" class="sv-b"><tspan x="486" dy="0">Studios you visit and select in, item by</tspan><tspan x="486" dy="12">item, or from curated collections.</tspan></text>
<path d="M488.8 212.5 l2.5600000000000005 2.8800000000000003 l4.800000000000001 -6.08" fill="none" stroke="#2C3F6B" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
<text x="504" y="216" class="sv-s"><tspan x="504" dy="0">You gain: the house you actually chose.</tspan></text>
<path d="M488.8 241.3 l6.4 6.4 M495.2 241.3 l-6.4 6.4" fill="none" stroke="#5F5A52" stroke-width="1.9" stroke-linecap="round"/>
<text x="504" y="248" class="sv-s"><tspan x="504" dy="0">You give up: budget certainty, and a</tspan><tspan x="504" dy="11">great deal of your time.</tspan></text>
<text x="0" y="292" class="sv-k">TWO HARD LIMITS NOBODY PUTS ON A FLYER</text>
<rect x="0" y="302" width="8" height="8" fill="#141A27"/>
<text x="16" y="309" class="sv-b"><tspan x="16" dy="0">Your design selections must be final before the build starts, at the one builder that publishes the rule.</tspan></text>
<rect x="0" y="328" width="8" height="8" fill="#141A27"/>
<text x="16" y="335" class="sv-b"><tspan x="16" dy="0">One builder states on every community page that buyers may be limited in the structural changes, options and upgrades they can make.</tspan></text>
<rect x="0" y="362" width="64" height="14" rx="3" fill="#FBE5DA"/><text x="32.0" y="372.2" class="sv-nf sv-c">NOT FOUND</text>
<text x="72" y="372" class="sv-s"><tspan x="72" dy="0">Not one of the twelve volume builders publishes a design center spend requirement, a design credit amount, or whether upgrades can be</tspan><tspan x="72" dy="11">financed. Ask both in writing.</tspan></text>
</svg>
</div></section>

<text x="26" y="99" style="font:600 10px Archivo,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;fill:#F7F5F0">Principal and interest</text>
<text x="26" y="111" style="font:500 8.4px Archivo,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;fill:#F7F5F0;opacity:.82">The only part a builder advertises</text>
<rect x="14" y="120" width="372" height="32" rx="4" fill="#2C3F6B"/>
<text x="26" y="135" style="font:600 10px Archivo,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;fill:#F7F5F0">Property tax</text>
<text x="26" y="147" style="font:500 8.4px Archivo,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;fill:#F7F5F0;opacity:.82">35 percent of taxable value, no cap in year one</text>
<rect x="14" y="156" width="372" height="32" rx="4" fill="#E4E9F2"/>
<text x="26" y="171" style="font:600 10px Archivo,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;fill:#1C2436">Homeowners insurance</text>
<text x="26" y="183" style="font:500 8.4px Archivo,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;fill:#1C2436;opacity:.82">Priced on rebuild cost, not what you paid</text>
<rect x="14" y="192" width="372" height="32" rx="4" fill="#E9714A"/>
<text x="26" y="207" style="font:600 10px Archivo,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;fill:#1C2436">Master HOA</text>
<text x="26" y="219" style="font:500 8.4px Archivo,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;fill:#1C2436;opacity:.82">Almost never published as a dollar amount</text>

<text x="26" y="243" style="font:600 10px Archivo,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;fill:#1C2436">Sub-association HOA</text>

<text x="446" y="122" class="sv-k" style="fill:#1C2436">OUTSIDE IT</text>
<text x="446" y="142" class="sv-l">The special assessment</text>
<text x="446" y="156" class="sv-b"><tspan x="446" dy="0">SID, or LID in Henderson. Billed semi-annually</tspan><tspan x="446" dy="11">about 60 days ahead, on its own bill, and a lien</tspan><tspan x="446" dy="11">until it is paid.</tspan></text>
<line x1="408" y1="148" x2="424" y2="148" stroke="#2C3F6B" stroke-width="1.6" marker-end="url(#sv-tri)"/>
<text x="416.0" y="140" class="sv-s sv-c">not in</text>
<text x="416.0" y="168" class="sv-s sv-c">escrow</text>
<text x="0" y="292" class="sv-k">HOW LONG YOU PAY IT</text>

<rect x="0" y="300" width="434.0" height="18" rx="4" fill="#2C3F6B"/>
<text x="10" y="313" class="sv-rs">10 to 30 years, financed at low interest</text>

<rect x="446" y="206" width="64" height="14" rx="3" fill="#FBE5DA"/><text x="478.0" y="216.2" class="sv-nf sv-c">NOT FOUND</text>
<text x="518" y="216" class="sv-s"><tspan x="518" dy="0">Master and sub HOA monthly amounts</tspan><tspan x="518" dy="11">are not published for most of these</tspan><tspan x="518" dy="11">communities.</tspan></text>
<rect x="0" y="332" width="700" height="44" rx="6" fill="#FBEFD3" stroke="#847B6D" stroke-width="1"/><text x="12" y="351" class="sv-b"><tspan x="12" dy="0">One builder's own footnote states its advertised monthly payments are principal and interest only, and that taxes, insurance and HOA are</tspan><tspan x="12" dy="11">not included. The homesite premium sits on top of the base price before any of this starts.</tspan></text>

<section><h2>svg-13</h2><div class="fig"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" width="100%"
     role="img" aria-labelledby="sv13t sv13d" font-family="Archivo,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">
<title id="sv13t">The two clocks of a move-up</title>
<desc id="sv13d">Two parallel timelines. The upper one is your build, split between the part a builder will estimate for you and the longer part only your contract governs. The lower one is your sale: prepare and list, under contract, then closed and needing somewhere to live. Four marked collision points: listing early and risking two payments, listing late and risking the build slot, the closing date moving because builders publish it as an estimate that is not guaranteed, and the contractual outside date arriving. A footer notes that eleven of twelve volume builders publish no contract-to-close time at all.</desc>

<text x="0" y="74" class="sv-k">YOUR BUILD</text>

<text x="618.52" y="171.5" class="sv-c" style="font:700 10px Archivo,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;fill:#F7F5F0">4</text>
<text x="0" y="206" class="sv-k">FOUR PLACES THEY COLLIDE</text>
<circle cx="8.0" cy="222" r="8.5" fill="#B8360F"/>
<text x="8.0" y="225.5" class="sv-c" style="font:700 10px Archivo,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;fill:#F7F5F0">1</text>
<text x="24.0" y="226" class="sv-l">List early</text>
<text x="0.0" y="250" class="sv-s"><tspan x="0.0" dy="0">You risk carrying two payments, or</tspan><tspan x="0.0" dy="11">moving twice.</tspan></text>
<circle cx="183.0" cy="222" r="8.5" fill="#B8360F"/>
<text x="183.0" y="225.5" class="sv-c" style="font:700 10px Archivo,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;fill:#F7F5F0">2</text>
<text x="199.0" y="226" class="sv-l">List late</text>
<text x="175.0" y="250" class="sv-s"><tspan x="175.0" dy="0">You risk losing the build slot you</tspan><tspan x="175.0" dy="11">waited for.</tspan></text>
<circle cx="358.0" cy="222" r="8.5" fill="#B8360F"/>
<text x="358.0" y="225.5" class="sv-c" style="font:700 10px Archivo,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;fill:#F7F5F0">3</text>
<text x="374.0" y="226" class="sv-l">The closing date moves</text>
<text x="350.0" y="250" class="sv-s"><tspan x="350.0" dy="0">Builders publish that the closing</tspan><tspan x="350.0" dy="11">date is an estimate and is not</tspan><tspan x="350.0" dy="11">guaranteed.</tspan></text>
<circle cx="533.0" cy="222" r="8.5" fill="#B8360F"/>
<text x="533.0" y="225.5" class="sv-c" style="font:700 10px Archivo,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;fill:#F7F5F0">4</text>
<text x="549.0" y="226" class="sv-l">The outside date arrives</text>
<text x="525.0" y="250" class="sv-s"><tspan x="525.0" dy="0">Only the contract deadline is</tspan><tspan x="525.0" dy="11">enforceable. One published clause</tspan><tspan x="525.0" dy="11">commits to finishing within two</tspan><tspan x="525.0" dy="11">years of signing.</tspan></text>
<rect x="0" y="288" width="700" height="44" rx="6" fill="#E4E9F2"/><text x="12" y="307" class="sv-b"><tspan x="12" dy="0">Eleven of the twelve volume builders publish no contract-to-close time for Las Vegas at all. So the question is not when will it be</tspan><tspan x="12" dy="11">done. It is what is the outside date in my contract, and what happens to me on that date.</tspan></text>
