<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="100%"
     role="img" aria-labelledby="sv08t sv08d" font-family="Archivo,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">
<title id="sv08t">What surrounds a lot</title>
<desc id="sv08d">A plan view of a cul-de-sac with six lots. An arterial road and a sound wall run along the top, so the lots on the upper row back the road. A dashed sun path arc crosses the drawing from sunrise to a marked 4 p.m. July position at the west, showing which rear yards carry afternoon sun. A hatched power line easement crosses two lots on the right. A retention basin sits at the lower left, and an arrow marks the direction drainage falls. A footer marks as NOT FOUND any Clark County source quantifying what lot orientation costs in utility bills or comfort.</desc>
