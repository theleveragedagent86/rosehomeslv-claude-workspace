<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="100%"
     role="img" aria-labelledby="sv10t sv10d" font-family="Archivo,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">
<title id="sv10t">Where the six areas are</title>
<desc id="sv10d">An abstract orientation schematic of the Las Vegas valley, not a street map. The basin is bounded by the Spring Mountains and Red Rock escarpment to the west and the Sheep Range to the north, with the 215 beltway drawn as a dashed loop, I-15 as a diagonal, and the Strip as a short heavy segment. Six numbered markers locate the areas this guide covers: Summerlin to the west, Skye Canyon and the northwest, North Las Vegas to the north, the southwest and Mountain's Edge, Henderson with Cadence and Inspirada to the southeast, and Union Village. Pahrump, Mesquite and Boulder City are outside the guide and are not drawn.</desc>
