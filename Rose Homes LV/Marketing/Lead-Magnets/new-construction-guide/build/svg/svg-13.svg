<rect width="700" height="340" fill="#F7F5F0"/>
<text x="0" y="14" class="sv-k">Page 11</text><text x="0" y="31" class="sv-h">The two clocks of a move-up</text>
<text x="0" y="74" class="sv-k">YOUR BUILD</text>
<rect x="118" y="58" width="582" height="24" rx="4" fill="#EDE9E0" stroke="#847B6D" stroke-width="1"/>
<rect x="118" y="58" width="302.64" height="24" rx="4" fill="#2C3F6B"/>
<text x="126" y="74" class="sv-rs">the part a builder will estimate for you</text>
<text x="455.56" y="74" class="sv-s">the part only your contract governs</text>
<text x="0" y="142" class="sv-k">YOUR SALE</text>
<rect x="118" y="126" width="582" height="24" rx="4" fill="#EDE9E0" stroke="#847B6D" stroke-width="1"/>
<rect x="118" y="126" width="197.88000000000002" height="24" rx="4" fill="#141A27"/>
<text x="126" y="142" class="sv-rs">prepare and list</text>
<rect x="315.88" y="126" width="128.04" height="24" rx="6" fill="#304880"/>
<text x="323.88" y="142" class="sv-rs">under contract</text>
<text x="455.56" y="142" class="sv-s">closed, and you need somewhere to live</text>
<line x1="315.88" y1="52" x2="315.88" y2="156" stroke="#B8360F" stroke-width="1.1" stroke-dasharray="4 3"/>
<line x1="420.64" y1="52" x2="420.64" y2="156" stroke="#B8360F" stroke-width="1.1" stroke-dasharray="4 3"/>
<line x1="443.92" y1="52" x2="443.92" y2="156" stroke="#B8360F" stroke-width="1.1" stroke-dasharray="4 3"/>
<line x1="618.52" y1="52" x2="618.52" y2="156" stroke="#B8360F" stroke-width="1.1" stroke-dasharray="4 3"/>
<circle cx="315.88" cy="168" r="8.5" fill="#B8360F"/>
<text x="315.88" y="171.5" class="sv-c" style="font:700 10px Archivo,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;fill:#F7F5F0">1</text>
<circle cx="420.64" cy="168" r="8.5" fill="#B8360F"/>
<text x="420.64" y="171.5" class="sv-c" style="font:700 10px Archivo,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;fill:#F7F5F0">2</text>
<circle cx="443.92" cy="168" r="8.5" fill="#B8360F"/>
<text x="443.92" y="171.5" class="sv-c" style="font:700 10px Archivo,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;fill:#F7F5F0">3</text>
<circle cx="618.52" cy="168" r="8.5" fill="#B8360F"/>
<text x="618.52" y="171.5" class="sv-c" style="font:700 10px Archivo,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;fill:#F7F5F0">4</text>
<text x="0" y="206" class="sv-k">FOUR PLACES THEY COLLIDE</text>
<circle cx="8.0" cy="222" r="8.5" fill="#B8360F"/>
<text x="8.0" y="225.5" class="sv-c" style="font:700 10px Archivo,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;fill:#F7F5F0">1</text>
<text x="24.0" y="226" class="sv-l">List early</text>
<text x="0.0" y="250" class="sv-s"><tspan x="0.0" dy="0">You risk carrying two payments, or</tspan><tspan x="0.0" dy="11">moving twice.</tspan></text>
<circle cx="183.0" cy="222" r="8.5" fill="#B8360F"/>
<text x="183.0" y="225.5" class="sv-c" style="font:700 10px Archivo,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;fill:#F7F5F0">2</text>
<text x="199.0" y="226" class="sv-l">List late</text>
<text x="175.0" y="250" class="sv-s"><tspan x="175.0" dy="0">You risk losing the build slot you</tspan><tspan x="175.0" dy="11">waited for.</tspan></text>
<circle cx="358.0" cy="222" r="8.5" fill="#B8360F"/>
<text x="358.0" y="225.5" class="sv-c" style="font:700 10px Archivo,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;fill:#F7F5F0">3</text>
<text x="374.0" y="226" class="sv-l">The closing date moves</text>
<text x="350.0" y="250" class="sv-s"><tspan x="350.0" dy="0">Builders publish that the closing</tspan><tspan x="350.0" dy="11">date is an estimate and is not</tspan><tspan x="350.0" dy="11">guaranteed.</tspan></text>
<circle cx="533.0" cy="222" r="8.5" fill="#B8360F"/>
<text x="533.0" y="225.5" class="sv-c" style="font:700 10px Archivo,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;fill:#F7F5F0">4</text>
<text x="549.0" y="226" class="sv-l">The outside date arrives</text>
<text x="525.0" y="250" class="sv-s"><tspan x="525.0" dy="0">Only the contract deadline is</tspan><tspan x="525.0" dy="11">enforceable. One published clause</tspan><tspan x="525.0" dy="11">commits to finishing within two</tspan><tspan x="525.0" dy="11">years of signing.</tspan></text>
<rect x="0" y="288" width="700" height="44" rx="6" fill="#E4E9F2"/><text x="12" y="307" class="sv-b"><tspan x="12" dy="0">Eleven of the twelve volume builders publish no contract-to-close time for Las Vegas at all. So the question is not when will it be</tspan><tspan x="12" dy="11">done. It is what is the outside date in my contract, and what happens to me on that date.</tspan></text>
</svg>
