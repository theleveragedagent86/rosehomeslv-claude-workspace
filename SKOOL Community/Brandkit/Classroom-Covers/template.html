<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Leveraged Agent, classroom cover</title>
<link rel="stylesheet" href="../Design-System/tokens.css">
<link rel="stylesheet" href="../Design-System/classroom-cover.css">
<script src="../Design-System/logo.js" defer></script>
<style>body{margin:0;background:transparent}</style>
</head>
<body>
<!-- Tokens, replace SUBTITLE before TITLE (TITLE_GOES_HERE is a substring of
     SUBTITLE_GOES_HERE, and doing it the other way round corrupts the subtitle). -->
<div class="cov" data-export="cover">
  <p class="cov__meta">META_GOES_HERE</p>
  <h1 class="cov__title">TITLE_GOES_HERE</h1>
  <hr class="cov__rule">
  <p class="cov__sub">SUBTITLE_GOES_HERE</p>
  <div class="cov__mark"><la-logo variant="wordmark" inverse no-tagline></la-logo></div>
</div>
<script src="fit-title.js"></script>
</body>
</html>
