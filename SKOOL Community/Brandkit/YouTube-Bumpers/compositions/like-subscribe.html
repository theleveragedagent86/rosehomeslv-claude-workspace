<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@600;800&family=Raleway:wght@600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Like + Subscribe OVERLAY. The Leveraged Agent, Vector v2.0 inverted.

         TRANSPARENT BACKGROUND ON PURPOSE. This renders to an alpha MOV and
         sits on a track above the recorded footage, so nothing here may paint
         a full-frame background. The two chips carry their own surface,
         because the footage underneath is an unknown brightness.

         Anchored bottom left: clear of YouTube's progress bar and the
         bottom-right player controls, clear of the top where titles live. */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px; overflow: hidden;
        background: transparent;
      }
      body { font-family: "Barlow", "Helvetica Neue", Arial, sans-serif; }

      #root {
        position: relative; width: 1920px; height: 1080px;
        background: transparent;
      }

      .dock {
        position: absolute; left: 96px; bottom: 132px;
        display: flex; align-items: center; gap: 20px;
      }

      .chip {
        display: flex; align-items: center; gap: 20px;
        height: 116px; padding: 0 40px;
        border-radius: 58px;
        /* a real drop shadow, because this lands on unknown footage */
        box-shadow: 0 8px 22px rgba(0,0,0,0.45), 0 30px 70px -24px rgba(0,0,0,0.75);
      }

      /* LIKE, secondary action, dark surface */
      .chip.like {
        background: rgba(6, 10, 26, 0.93);
        border: 1px solid #2A3550;
      }
      .chip.like .label { color: #FFFFFF; }

      /* SUBSCRIBE, primary action, the accent as a FILL with white on it.
         That is the canonical 5.06:1 accent-on pairing, and a solid accent
         block is the one thing guaranteed to read over any footage. */
      .chip.sub {
        background: #1768E5;
        border: 1px solid #1768E5;
      }
      .chip.sub .label { color: #FFFFFF; }

      .label {
        font-weight: 800; font-size: 42px;
        letter-spacing: -0.028em; text-transform: uppercase;
        white-space: nowrap;
      }

      .ico { width: 54px; height: 54px; flex: none; display: block; }
      .ico.thumb { transform-origin: 26% 78%; }

      /* The tap ring that fires once on the thumb. Centred on the 54px icon,
         so the offset is (54 - 72) / 2. It is a sibling of the icon inside
         .likeInner rather than a child, because the icon itself gets scaled
         and rotated on the press and the ring must not inherit that. */
      .ring {
        position: absolute; left: -9px; top: -9px;
        width: 72px; height: 72px; border-radius: 50%;
        border: 3px solid #5B9BFF;
        opacity: 0; pointer-events: none;
      }
      .likeInner { position: relative; display: flex; align-items: center; gap: 20px; }

      .play {
        width: 0; height: 0; flex: none;
        border-left: 34px solid #FFFFFF;
        border-top: 21px solid transparent;
        border-bottom: 21px solid transparent;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="like-subscribe"
      data-start="0"
      data-duration="6"
      data-width="1920"
      data-height="1080"
    >
      <div class="dock">
        <div class="chip like" id="chipLike">
          <div class="likeInner">
            <svg class="ico thumb" id="thumb" viewBox="0 0 32 32" fill="none" aria-hidden="true">
              <rect x="2.5" y="13.3" width="6.6" height="16.4" rx="1.9" fill="#5B9BFF" />
              <path
                d="M11.4 29.7 L24 29.7 C26.1 29.7 27.6 28.3 27.9 26.5 L29.6 17.6 C30 15.4 28.4 13.4 26.1 13.4 L19.2 13.4 L20.4 7.3 C20.8 5.2 19.4 3.1 17.2 2.7 C16.4 2.55 15.6 3 15.3 3.75 L11.9 12.2 C11.55 13.05 11.4 13.7 11.4 14.5 Z"
                fill="#5B9BFF"
              />
            </svg>
            <div class="ring" id="ring"></div>
          </div>
          <div class="label">Like</div>
        </div>

        <div class="chip sub" id="chipSub">
          <div class="play"></div>
          <div class="label">Subscribe</div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* in, staggered, with a small overshoot so it feels physical */
      tl.fromTo(
        "#chipLike",
        { opacity: 0, x: -140 },
        { opacity: 1, x: 0, duration: 0.62, ease: "back.out(1.5)" },
        0
      );
      tl.fromTo(
        "#chipSub",
        { opacity: 0, x: -140 },
        { opacity: 1, x: 0, duration: 0.62, ease: "back.out(1.5)" },
        0.16
      );

      /* the thumb gets pressed once, with a ring popping off it */
      tl.to("#thumb", { scale: 0.78, rotation: -12, duration: 0.16, ease: "power2.in" }, 1.15);
      tl.to("#thumb", { scale: 1, rotation: 0, duration: 0.42, ease: "back.out(3)" }, 1.31);
      /* immediateRender:false is load bearing. GSAP fromTo defaults it to true,
         which stamps the from-state at build time and would leave the ring
         sitting at 0.9 opacity from frame 0 until this tween starts. With it
         off, the ring holds the CSS opacity:0 until 1.3s, which is the point. */
      tl.fromTo(
        "#ring",
        { opacity: 0.9, scale: 0.4 },
        { opacity: 0, scale: 2.15, duration: 0.62, ease: "power2.out", immediateRender: false },
        1.3
      );

      /* subscribe answers it */
      tl.to("#chipSub", { scale: 1.055, duration: 0.22, ease: "power2.out" }, 2.05);
      tl.to("#chipSub", { scale: 1, duration: 0.5, ease: "back.out(2.4)" }, 2.27);

      /* out, reverse stagger, fully clear by 6.0 */
      tl.to("#chipSub", { opacity: 0, x: -140, duration: 0.5, ease: "power3.in" }, 5.1);
      tl.to("#chipLike", { opacity: 0, x: -140, duration: 0.5, ease: "power3.in" }, 5.24);

      window.__timelines["like-subscribe"] = tl;
    </script>
  </body>
</html>
