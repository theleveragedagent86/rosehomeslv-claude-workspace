<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1280px; height:720px; overflow:hidden; background:#ffffff; }
  .thumb { position:relative; width:1280px; height:720px; background:#ffffff; }
  .text {
    position:absolute;
    left:70px;
    top:96px;
    width:660px;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-weight:900;
    font-size:118px;
    line-height:0.92;
    letter-spacing:-0.02em;
    color:#0a0a0a;
    text-transform:lowercase;
  }
  .photo-frame {
    position:absolute;
    top:0;
    right:0;
    width:500px;
    height:720px;
    overflow:hidden;
  }
  .photo {
    position:absolute;
    top:-209px;
    left:50%;
    transform:translateX(-50%);
    height:2081px;
    width:auto;
    display:block;
  }
</style>
</head>
<body>
  <div class="thumb">
    <div class="text">photos<br>become<br>leads.</div>
    <div class="photo-frame"><img class="photo" src="headshot-white-bg.png"></div>
  </div>
</body>
</html>
