<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; }
  .thumb { position: relative; width: 1280px; height: 720px; overflow: hidden; background: var(--navy); }

  .plate { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  /* Scrim keeps the headline readable over any plate without dimming the whole frame. */
  .scrim {
    position: absolute; inset: 0;
    background:
      linear-gradient(100deg, var(--navy) 0%, color-mix(in srgb, var(--navy) 92%, transparent) 38%,
                     color-mix(in srgb, var(--navy) 35%, transparent) 62%, transparent 78%),
      linear-gradient(to top, color-mix(in srgb, var(--navy) 80%, transparent) 0%, transparent 30%);
  }

  .cutout {
    position: absolute; right: -20px; bottom: 0; height: 760px; width: auto;
    filter: drop-shadow(-18px 10px 26px rgba(0,0,0,0.55));
  }

  .copy { position: absolute; left: 56px; top: 0; bottom: 0; width: 700px;
          display: flex; flex-direction: column; justify-content: center; gap: 20px; }

  .kicker {
    font-family: var(--kickerFont); font-weight: var(--kickerWeight);
    font-size: 30px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--gold); display: flex; align-items: center; gap: 16px;
  }
  .kicker::after { content: ''; flex: 1; height: 2px; background: var(--gold); opacity: 0.75; }

  .headline {
    font-family: var(--headlineFont); font-weight: var(--headlineWeight);
    font-size: 104px; line-height: 0.98; letter-spacing: -0.025em;
    text-transform: uppercase; color: #fff;
    text-shadow: 0 4px 18px rgba(0,0,0,0.75), 0 1px 0 rgba(0,0,0,0.6);
  }
  .headline .accent { color: var(--gold); }
  .headline .strike { position: relative; }
  .headline .strike::after {
    content: ''; position: absolute; left: -2%; right: -2%; top: 52%;
    height: 9px; background: var(--alert); transform: rotate(-3deg);
  }

  .badge {
    align-self: flex-start; background: var(--gold); color: var(--navy);
    font-family: var(--labelFont); font-weight: 800; font-size: 44px;
    letter-spacing: -0.01em; padding: 10px 26px 12px; border-radius: 4px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.45);
  }

  .disclaimer {
    position: absolute; left: 56px; bottom: 26px;
    font-family: var(--labelFont); font-weight: 600; font-size: 19px;
    letter-spacing: 0.08em; text-transform: uppercase;
    color: #fff; opacity: 0.6;
  }
</style>
</head>
<body>
  <div class="thumb">
    <img class="plate" id="plate" hidden>
    <div class="scrim"></div>
    <img class="cutout" id="cutout" hidden>
    <div class="copy">
      <div class="kicker" id="kicker" hidden></div>
      <div class="headline" id="headline"></div>
      <div class="badge" id="badge" hidden></div>
    </div>
    <div class="disclaimer" id="disclaimer" hidden></div>
  </div>

<script>
const SPEC = /*SPEC*/null;
const { brand } = SPEC;

const root = document.documentElement.style;
root.setProperty('--navy', brand.colors.navy);
root.setProperty('--gold', brand.colors.gold);
root.setProperty('--alert', brand.colors.alert);
root.setProperty('--headlineFont', brand.fonts.headline);
root.setProperty('--headlineWeight', brand.fonts.headlineWeight);
root.setProperty('--kickerFont', brand.fonts.kicker);
root.setProperty('--kickerWeight', brand.fonts.kickerWeight);
root.setProperty('--labelFont', brand.fonts.label);

const show = (id, fn) => { const el = document.getElementById(id); el.hidden = false; fn(el); };

if (SPEC.plate) show('plate', el => el.src = SPEC.plate);
if (SPEC.cutout) show('cutout', el => el.src = SPEC.cutout);
if (SPEC.kicker) show('kicker', el => el.textContent = SPEC.kicker);
if (SPEC.badge) show('badge', el => el.textContent = SPEC.badge);
if (SPEC.disclaimer ?? brand.disclaimer) {
  show('disclaimer', el => el.textContent = SPEC.disclaimer ?? brand.disclaimer);
}

// Headline markup: [[word]] renders gold, ~~word~~ renders struck through in red.
const headline = document.getElementById('headline');
headline.innerHTML = SPEC.headline
  .replace(/\[\[(.+?)\]\]/g, '<span class="accent">$1</span>')
  .replace(/~~(.+?)~~/g, '<span class="strike">$1</span>')
  .replace(/\n/g, '<br>');

// Shrink to fit rather than overflow. Long headlines lose the click anyway, so
// the floor is deliberately high: below it, the copy is too long for a thumbnail.
document.fonts.ready.then(() => {
  const box = headline.parentElement;
  let size = 104;
  while (size > 62 && (headline.scrollHeight > box.clientHeight - 120 || headline.scrollWidth > box.clientWidth)) {
    size -= 2;
    headline.style.fontSize = size + 'px';
  }
  if (size <= 62) console.warn(`Headline too long for a thumbnail at ${size}px, cut words.`);
});
</script>
</body>
</html>
